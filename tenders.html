<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender Inbox — BidDost AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design.css?v=2">
</head>
<body>
<div class="topbar">
  <span class="logo">B</span> BidDost AI
  <span class="lbl brand" style="font-size:11px;">TENDER INBOX</span>
  <span class="right">
    <button class="btn ghost sm" style="color:#fff;" onclick="BIDDOST.go('company-profile.html')">Profile</button>
    <span id="user-name"></span>
    <button class="btn ghost sm" style="color:#fff;" onclick="BIDDOST.signOut().then(function(){BIDDOST.go('login.html')})">Log out</button>
  </span>
</div>

<div class="onboard">
  <div id="form-alert" class="alert danger" role="alert"></div>
  <div id="success-alert" class="alert success" role="alert"></div>

  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;">
    <div>
      <h2 style="font-size:22px;">Tender Inbox <span class="lbl gray" id="total-count">0</span></h2>
      <p class="muted" style="margin-top:4px;">Tenders matched to your profile. Click any row to view details.</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn sec" onclick="loadTenders()">↻ Refresh</button>
      <button class="btn pri" id="upload-btn" onclick="BIDDOST.go('upload-tender.html')">+ Upload Tender</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card" style="padding:14px 18px; margin-bottom:16px;">
    <div class="filter-bar">
      <input class="in search" id="f-search" type="text" placeholder="🔍 Search tenders by title, reference, or organisation…">
      <select class="in" id="f-level">
        <option value="">All Levels</option>
        <option value="Federal">Federal</option>
        <option value="Provincial">Provincial</option>
        <option value="Public-sector">Public-sector</option>
      </select>
      <select class="in" id="f-status">
        <option value="">All Status</option>
        <option value="New">New</option>
        <option value="Analyzed">Analyzed</option>
        <option value="Review">Review</option>
        <option value="Extracting">Extracting</option>
        <option value="Ineligible">Ineligible</option>
      </select>
      <select class="in" id="f-match">
        <option value="">Any Match</option>
        <option value="70">Match ≥ 70%</option>
        <option value="50">Match ≥ 50%</option>
        <option value="40">Match ≥ 40%</option>
      </select>
      <select class="in" id="f-sort">
        <option value="deadline">Sort: Deadline</option>
        <option value="match">Sort: Match Score</option>
        <option value="value">Sort: Value</option>
        <option value="newest">Sort: Newest</option>
      </select>
    </div>
  </div>

  <!-- Saved Searches -->
  <div class="card" style="padding:14px 18px; margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="card-h" style="font-size:14px; margin-bottom:0;">Saved Searches</div>
      <button class="btn ghost sm" id="save-search-btn" onclick="saveCurrentSearch()">Save current filters</button>
    </div>
    <div id="saved-searches" style="display:flex; flex-wrap:wrap; gap:8px;">
      <span class="tiny" style="color:var(--neutral-400);">No saved searches yet.</span>
    </div>
  </div>

  <!-- Tender Table -->
  <div class="card" style="padding:0; overflow:hidden;">
    <table class="tender-tbl">
      <thead>
        <tr>
          <th style="width:36px;"></th>
          <th>Tender</th>
          <th>Level</th>
          <th>Source</th>
          <th>AI Match</th>
          <th>Deadline</th>
          <th>Status</th>
          <th style="width:40px;"></th>
        </tr>
      </thead>
      <tbody id="tender-list"></tbody>
    </table>
    <div class="empty hide" id="tender-empty">
      <div class="big">📥</div>
      No tenders match your filters. Try adjusting your search or upload a new tender.
    </div>
  </div>

  <!-- Pagination -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
    <span class="tiny" id="showing-text">Showing 0 tenders</span>
    <div style="display:flex; gap:6px;" id="pagination"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script src="js/app.js?v=4"></script>
<script>
(function () {
  var B = window.BIDDOST;
  B.guard("auth");

  var user = null, companyId = null;
  var allTenders = [];
  var savedSearches = JSON.parse(localStorage.getItem("biddost_saved_searches") || "[]");
  var currentPage = 1;
  var perPage = 10;

  /* ====== Load tenders ====== */
  function loadTenders() {
    var filters = {};
    var search = document.getElementById("f-search").value.trim();
    var level = document.getElementById("f-level").value;
    var status = document.getElementById("f-status").value;
    var minMatch = document.getElementById("f-match").value;
    var sort = document.getElementById("f-sort").value;

    if (user && user.id) filters.uploadedBy = user.id;
    if (search) filters.search = search;
    if (level) filters.level = level;
    if (status) filters.status = status;
    if (minMatch) filters.minMatch = minMatch;

    B.listTenders(Object.keys(filters).length ? filters : null).then(function (res) {
      if (res.error) { B.alert("form-alert", "danger", res.error.message); return; }
      var list = res.data || [];

      if (sort === "match") {
        list.sort(function (a, b) { return (b.match_score || 0) - (a.match_score || 0); });
      } else if (sort === "value") {
        list.sort(function (a, b) { return (b.value_pkr || 0) - (a.value_pkr || 0); });
      } else if (sort === "newest") {
        list.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      }
      // default "deadline" sort comes from Supabase order()

      allTenders = list;
      currentPage = 1;
      renderTenders();
    });
  }

  window.loadTenders = loadTenders;

  /* ====== Render tender rows ====== */
  function renderTenders() {
    var start = (currentPage - 1) * perPage;
    var page = allTenders.slice(start, start + perPage);
    var total = allTenders.length;

    document.getElementById("total-count").textContent = total;
    document.getElementById("tender-empty").classList.toggle("hide", total > 0);
    document.getElementById("showing-text").textContent = "Showing " + (total ? start + 1 : 0) + "–" + Math.min(start + perPage, total) + " of " + total + " tenders";

    var box = document.getElementById("tender-list");
    box.innerHTML = "";

    page.forEach(function (t) {
      var icon = t.file_path && t.file_path.match(/\.(png|jpg|jpeg)$/i) ? "🖼" : "📄";
      var levelMap = { "Federal": "federal", "Provincial": "provincial", "Public-sector": "public" };
      var levelCls = levelMap[t.level] || "federal";
      var dc = B.deadlineCountdown(t.deadline);
      var mc = B.matchBadge(t.match_score);

      var statusCls = (t.status || "new").toLowerCase().replace(/\s+/g, "");

      var tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      var tenderUrl = "tender-detail.html?id=" + t.id;
      tr.innerHTML =
        '<td class="t-icon">' + icon + '</td>' +
        '<td><div class="t-title"><a href="' + tenderUrl + '" style="color:inherit;text-decoration:none;">' + B.escape(t.title) + '</a></div>' +
        '<div class="t-ref">' + B.escape(t.organisation || "") + (t.reference ? " · Ref " + B.escape(t.reference) : "") + '</div></td>' +
        '<td><span class="lvl ' + levelCls + '">' + B.escape(t.level) + '</span></td>' +
        '<td>' + B.escape(t.source || "—") + '</td>' +
        '<td>' +
          (t.match_score != null
            ? '<span class="scorebar ' + (t.match_score >= 70 ? "hi" : t.match_score >= 40 ? "mid" : "low") + '" style="width:70px"><i style="width:' + t.match_score + '%"></i></span> <span class="' + mc.cls + '">' + mc.label + '</span>'
            : '<span class="lbl gray">Pending</span>') +
        '</td>' +
        '<td><span class="' + dc.cls + '">' + (t.deadline ? B.escape(t.deadline) : "—") + '</span><br><span class="tiny">' + dc.label + '</span></td>' +
        '<td><span class="sts ' + statusCls + '">' + B.escape(t.status) + '</span></td>' +
        '<td><button class="btn sec sm" style="padding:4px 8px; font-size:11px;" onclick="event.stopPropagation(); toggleSave(\'' + t.id + '\')">♡</button></td>';
      tr.addEventListener("click", function (e) {
        if (e.target.tagName !== "BUTTON" && e.target.tagName !== "A") {
          window.location.href = "tender-detail.html?id=" + t.id;
        }
      });
      box.appendChild(tr);
    });

    renderPagination();
  }

  /* ====== Pagination ====== */
  function renderPagination() {
    var totalPages = Math.ceil(allTenders.length / perPage);
    var box = document.getElementById("pagination");
    box.innerHTML = "";
    if (totalPages <= 1) return;

    if (currentPage > 1) {
      var prev = document.createElement("button");
      prev.className = "btn sec sm";
      prev.textContent = "‹ Prev";
      prev.onclick = function () { currentPage--; renderTenders(); };
      box.appendChild(prev);
    }

    for (var i = 1; i <= totalPages; i++) {
      (function (pg) {
        var btn = document.createElement("button");
        btn.className = "btn " + (pg === currentPage ? "pri" : "sec") + " sm";
        btn.textContent = pg;
        btn.onclick = function () { currentPage = pg; renderTenders(); };
        box.appendChild(btn);
      })(i);
    }

    if (currentPage < totalPages) {
      var next = document.createElement("button");
      next.className = "btn sec sm";
      next.textContent = "Next ›";
      next.onclick = function () { currentPage++; renderTenders(); };
      box.appendChild(next);
    }
  }

  /* ====== Save/unsave tender ====== */
  window.toggleSave = function (tenderId) {
    if (!companyId) return;
    B.saveTender(companyId, tenderId, null, null).then(function (res) {
      if (res.error) { B.alert("form-alert", "danger", res.error.message); return; }
      B.alert("success-alert", "success", "Tender saved to your list.");
    });
  };

  /* ====== Saved searches ====== */
  function renderSavedSearches() {
    var box = document.getElementById("saved-searches");
    box.innerHTML = "";
    if (!savedSearches.length) {
      box.innerHTML = '<span class="tiny" style="color:var(--neutral-400);">No saved searches yet.</span>';
      return;
    }
    savedSearches.forEach(function (s, i) {
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.innerHTML = B.escape(s.name) +
        ' <button onclick="removeSavedSearch(' + i + ')">✕</button>';
      tag.querySelector("button").addEventListener("click", function (e) {
        e.stopPropagation();
        removeSavedSearch(i);
      });
      tag.style.cursor = "pointer";
      tag.onclick = function () { applySearch(s); };
      box.appendChild(tag);
    });
  }

  window.saveCurrentSearch = function () {
    var name = prompt("Name this search:");
    if (!name) return;
    var filters = {
      name: name,
      search: document.getElementById("f-search").value,
      level: document.getElementById("f-level").value,
      status: document.getElementById("f-status").value,
      match: document.getElementById("f-match").value,
      sort: document.getElementById("f-sort").value
    };
    savedSearches.push(filters);
    localStorage.setItem("biddost_saved_searches", JSON.stringify(savedSearches));
    renderSavedSearches();
    B.alert("success-alert", "success", "Search saved: " + name);
  };

  window.removeSavedSearch = function (i) {
    savedSearches.splice(i, 1);
    localStorage.setItem("biddost_saved_searches", JSON.stringify(savedSearches));
    renderSavedSearches();
  };

  function applySearch(s) {
    document.getElementById("f-search").value = s.search || "";
    document.getElementById("f-level").value = s.level || "";
    document.getElementById("f-status").value = s.status || "";
    document.getElementById("f-match").value = s.match || "";
    document.getElementById("f-sort").value = s.sort || "deadline";
    loadTenders();
  }

  /* ====== Upload tender (placeholder) ====== */
  window.uploadTender = function () {
    B.alert("form-alert", "info", "Tender upload will be available in the next task (AI extraction). For now, sample tenders are loaded from the database.");
  };

  /* ====== Filter events ====== */
  var filterIds = ["f-search", "f-level", "f-status", "f-match", "f-sort"];
  filterIds.forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      clearTimeout(window._filterTimer);
      window._filterTimer = setTimeout(loadTenders, id === "f-search" ? 400 : 0);
    });
    document.getElementById(id).addEventListener("change", loadTenders);
  });

  /* ====== Init ====== */
  B.user().then(function (u) {
    user = u;
    if (u && u.user_metadata && u.user_metadata.full_name) document.getElementById("user-name").textContent = u.user_metadata.full_name;
    B.setupRealtimeNotifications(u.id);
    return B.getCompany(u.id);
  }).then(function (res) {
    if (res.error || !res.data) { companyId = null; } else { companyId = res.data.id; }
    loadTenders();
    renderSavedSearches();
  }).catch(function () {
    loadTenders();
    renderSavedSearches();
  });
})();
</script>
</body>
</html>
