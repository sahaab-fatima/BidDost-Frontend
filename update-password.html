<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — BidDost AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design.css">
</head>
<body>
<div class="auth">
  <div class="panel">
    <div class="brand"><span class="logo">B</span> BidDost AI</div>
    <div>
      <h1>Set a new password.</h1>
      <p>Choose something strong — at least 8 characters with a mix of letters, numbers and symbols.</p>
    </div>
  </div>

  <div class="form-side">
    <div class="card">
      <h2>New password</h2>
      <p class="muted" style="margin:4px 0 20px;">Your reset link has been verified.</p>

      <div id="form-alert" class="alert danger" role="alert"></div>

      <form id="pwd-form" novalidate>
        <div class="col">
          <div>
            <label class="lbl-f" for="password">New password</label>
            <input class="in" id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
            <div class="pw-hint"><span id="pw-meter"></span></div>
          </div>
          <div>
            <label class="lbl-f" for="confirm">Confirm new password</label>
            <input class="in" id="confirm" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
          </div>
          <button class="btn pri full" type="submit"><span class="spin"></span> Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script>
  (function () {
    var B = window.BIDDOST;
    B.guard("guest");

    var meter = document.getElementById("pw-meter");
    document.getElementById("password").addEventListener("input", function (e) {
      var s = B.pwStrength(e.target.value);
      meter.className = s <= 1 ? "weak" : s <= 3 ? "mid" : "strong";
    });

    var form = document.getElementById("pwd-form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = form.querySelector(".btn.pri");
      var password = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;

      if (password.length < 8) { B.alert("form-alert", "danger", "Password must be at least 8 characters."); return; }
      if (password !== confirm) { B.alert("form-alert", "danger", "Passwords do not match."); return; }

      B.setBusy(btn, true);
      B.hideAlert("form-alert");
      B.updatePassword(password).then(function (res) {
        B.setBusy(btn, false);
        if (res.error) { B.alert("form-alert", "danger", res.error.message); return; }
        B.go("login.html");
      });
    });
  })();
</script>
</body>
</html>
